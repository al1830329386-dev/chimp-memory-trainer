<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle 背景 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- 发光卡片网格元素示意 -->
  <g transform="translate(106, 106)">
    <!-- 4 个格子 -->
    <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#tileGrad)" filter="url(#glow)"/>
    <text x="70" y="94" font-family="-apple-system, SF Pro Display, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>

    <rect x="160" y="0" width="140" height="140" rx="32" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <text x="230" y="94" font-family="-apple-system, SF Pro Display, sans-serif" font-size="76" font-weight="900" fill="rgba(255, 255, 255, 0.4)" text-anchor="middle">2</text>

    <rect x="0" y="160" width="140" height="140" rx="32" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <text x="70" y="254" font-family="-apple-system, SF Pro Display, sans-serif" font-size="76" font-weight="900" fill="rgba(255, 255, 255, 0.4)" text-anchor="middle">3</text>

    <rect x="160" y="160" width="140" height="140" rx="32" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(10, 132, 255, 0.5)" stroke-width="3"/>
    <circle cx="230" cy="230" r="16" fill="#0a84ff"/>
  </g>
</svg>
